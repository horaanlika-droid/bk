<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Большой Кофе — хороший кофе каждый день. Меню, заказ с собой и БК-Коины."
    />
    <title>Большой Кофе</title>
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Большой Кофе — главная"
        ><img src="assets/logo.png" alt="" /><span
          >БОЛЬШОЙ КОФЕ<small>ХОРОШИЙ КОФЕ. КАЖДЫЙ ДЕНЬ.</small></span
        ></a
      >
      <nav class="desktop-nav" aria-label="Основная навигация">
        <a href="#home" data-page="home">Главная</a
        ><a href="#menu" data-page="menu">Меню</a
        ><a href="#coins" data-page="coins">БК-Коины</a>
      </nav>
      <div class="header-actions">
        <button class="location-button" id="locationTop">
          <span data-icon="pin"></span><span id="city">Волжский</span
          ><span data-icon="chevron"></span></button
        ><button
          class="icon-button cart-trigger"
          id="cartTop"
          aria-label="Открыть корзину"
        >
          <span data-icon="bag"></span><i id="cartCount" hidden>0</i></button
        ><a
          class="icon-button profile-link"
          href="#profile"
          aria-label="Профиль"
          ><span data-icon="user"></span
        ></a>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <a class="brand" href="#home"
        ><img src="assets/logo.png" alt="" /><span>БОЛЬШОЙ КОФЕ</span></a
      ><span>Маленькая пауза. Большое удовольствие.</span
      ><a href="https://t.me/bk_kofe" target="_blank" rel="noopener"
        >Мы в Telegram
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <path d="M6 18 18 6M6 6h12v12" /></svg
      ></a>
    </footer>
    <nav class="tabbar" aria-label="Основная навигация">
      <a href="#home" data-page="home"><span data-icon="home"></span>Главная</a
      ><a href="#menu" data-page="menu"><span data-icon="cup"></span>Меню</a
      ><a href="#coins" data-page="coins"
        ><span class="nav-coin"><img src="assets/coin-mark.png" alt="" /></span
        >Коины</a
      ><a href="#profile" data-page="profile"
        ><span data-icon="user"></span>Профиль</a
      >
    </nav>
    <button class="floating-cart" id="floatingCart" hidden>
      <span class="float-label"
        ><span data-icon="bag"></span>Корзина <i id="floatCount">0</i></span
      ><b id="floatTotal">0 ₽</b><span data-icon="arrow"></span>
    </button>
    <div class="overlay" id="overlay" hidden>
      <section
        class="sheet"
        id="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheetTitle"
        tabindex="-1"
      ></section>
    </div>
    <div
      id="announcements"
      class="toast-region"
      role="status"
      aria-live="polite"
    ></div>
    <script src="app.js"></script>
  </body>
</html>
